name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      # GIF と schema.org の語は公開データセット（gif・schemaorg）から引く。トークンは渡さない
      - run: uv run scripts/check.py
